query MilestoneReport(
  $owner: String!
  $repo: String!
  $project: Int!
  $milestone: Int!
  $plan: Boolean! = false
  $endCursor: String
) {
  repository(owner: $owner, name: $repo) {
    id
    visibility
    owner {
      ... on ProjectV2Owner {
        projectV2(number: $project) {
          id
          public
          fields(first: 50) @include(if: $plan) {
            nodes {
              ... on ProjectV2SingleSelectField {
                name
                options {
                  id
                  name
                }
              }
            }
          }
          url
        }
      }
    }
    milestone(number: $milestone) {
      url
      issues(
        first: 50
        after: $endCursor
        orderBy: { field: CREATED_AT, direction: ASC }
      ) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          number
          title
          url
          state
          stateReason
          body @include(if: $plan)
          blockedBy(first: 10) @include(if: $plan) {
            nodes {
              number
              url
              state
              repository {
                id
              }
            }
          }
          closedByPullRequestsReferences(first: 10, includeClosedPrs: false) {
            pageInfo {
              hasNextPage
            }
            nodes {
              number
              url
              state
              isDraft
              repository {
                id
              }
            }
          }
          issueDependenciesSummary {
            blockedBy
          }
          subIssuesSummary {
            completed
            total
          }
          projectItems(first: 100, includeArchived: false) {
            pageInfo {
              hasNextPage
            }
            nodes {
              project {
                id
              }
              priority: fieldValueByName(name: "Priority") @include(if: $plan) {
                ... on ProjectV2ItemFieldSingleSelectValue {
                  optionId
                }
              }
              fieldValueByName(name: "Status") {
                ... on ProjectV2ItemFieldSingleSelectValue {
                  name
                }
              }
            }
          }
        }
      }
    }
  }
}
