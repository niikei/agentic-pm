name: Quality

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ github.event_name == 'pull_request' && 'Repository checks' || 'Comprehensive checks' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.11.7
          sha256: ${{ runner.os == 'macOS' && '0f7cb85b5c17208cb67088105bd1754c38314cb824cc97d109631b6df638f6fc' || '8f5426d9971eaf713b37509749174ca69cf2f08b8b25e389168dcfcab9cd1a4d' }}
          cache: false
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm check
      - if: github.event_name == 'workflow_dispatch'
        run: mise exec -- pnpm check:online
